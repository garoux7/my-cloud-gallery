<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cloud Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: white;
}

header {
    padding: 22px 16px 10px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    color: #9ca3af;
    margin-top: 7px;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.card {
    background: #181b24;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
}

input,
select,
button {
    font: inherit;
}

input[type="email"],
input[type="password"],
input[type="text"],
select {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #252936;
    color: white;
    outline: none;
    margin-bottom: 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 15px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

.secondary {
    background: #292d3a;
}

.danger {
    background: #dc3545;
}

.green {
    background: #198754;
}

.auth-buttons {
    display: flex;
    gap: 10px;
}

.auth-buttons button {
    flex: 1;
}

.hidden {
    display: none !important;
}

.user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.user-email {
    color: #aaa;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.upload-area {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.upload-area input[type="file"] {
    display: none;
}

.upload-label {
    display: inline-block;
    background: #5865f2;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
}

.storage {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 12px;
}

.search {
    margin-bottom: 12px;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.category {
    white-space: nowrap;
    background: #252936;
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
    color: #bbb;
}

.category.active {
    background: #5865f2;
    color: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
}

.photo {
    position: relative;
    background: #181b24;
    border-radius: 13px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
}

.star {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    font-size: 19px;
}

.delete {
    position: absolute;
    bottom: 7px;
    right: 7px;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    background: rgba(220,53,69,.9);
}

.photo-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 25px 7px 7px;
    background: linear-gradient(transparent, rgba(0,0,0,.8));
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.empty {
    text-align: center;
    color: #777;
    padding: 40px 10px;
}

#message {
    margin-top: 10px;
    font-size: 14px;
    color: #9ca3af;
}

#fullscreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

#fullscreen img {
    max-width: 96%;
    max-height: 90%;
    object-fit: contain;
}

#closeFullscreen {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,.15);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    font-size: 22px;
}

.progress {
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
}

@media (max-width: 500px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    .user-bar {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <h1>📸 My Cloud Gallery</h1>
    <div class="subtitle">
        Your personal photo & screenshot storage
    </div>
</header>

<div class="container">

    <!-- LOGIN -->
    <div id="authCard" class="card">

        <h2>🔐 Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <div class="auth-buttons">
            <button id="loginBtn">Login</button>
            <button id="signupBtn" class="secondary">Sign Up</button>
        </div>

        <div id="authMessage"></div>

    </div>


    <!-- GALLERY -->
    <div id="galleryApp" class="hidden">

        <div class="user-bar">

            <div class="user-email" id="userEmail"></div>

            <button id="logoutBtn" class="secondary">
                Logout
            </button>

        </div>


        <!-- UPLOAD -->
        <div class="card">

            <h3>📤 Add Photos</h3>

            <div class="upload-area">

                <label class="upload-label">
                    📸 Choose Photos
                    <input
                        type="file"
                        id="fileInput"
                        accept="image/*"
                        multiple
                    >
                </label>

            </div>

            <br>

            <select id="categorySelect">

                <option value="Other">
                    Other
                </option>

                <option value="Anime">
                    Anime
                </option>

                <option value="Gaming">
                    Gaming
                </option>

                <option value="Memes">
                    Memes
                </option>

                <option value="Personal">
                    Personal
                </option>

            </select>

            <div id="uploadProgress" class="progress"></div>

            <div class="storage" id="storageInfo">
                Loading storage information...
            </div>

        </div>


        <!-- SEARCH -->
        <div class="card">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="🔎 Search photos..."
            >

            <div class="categories">

                <div
                    class="category active"
                    data-category="All">
                    All
                </div>

                <div
                    class="category"
                    data-category="Anime">
                    Anime
                </div>

                <div
                    class="category"
                    data-category="Gaming">
                    Gaming
                </div>

                <div
                    class="category"
                    data-category="Memes">
                    Memes
                </div>

                <div
                    class="category"
                    data-category="Personal">
                    Personal
                </div>

                <div
                    class="category"
                    data-category="Other">
                    Other
                </div>

                <div
                    class="category"
                    data-category="Favorites">
                    ⭐ Favorites
                </div>

            </div>

        </div>


        <!-- GALLERY -->
        <div id="gallery" class="gallery"></div>

        <div id="empty" class="empty hidden">
            No photos found.
        </div>

    </div>

</div>


<!-- FULLSCREEN -->

<div id="fullscreen">

    <button id="closeFullscreen">
        ✕
    </button>

    <img id="fullscreenImage">

</div>
