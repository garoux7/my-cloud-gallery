<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cloud Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: white;
}

header {
    padding: 22px 16px 10px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    color: #9ca3af;
    margin-top: 7px;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.card {
    background: #181b24;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
}

input,
select,
button {
    font: inherit;
}

input[type="email"],
input[type="password"],
input[type="text"],
select {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #252936;
    color: white;
    outline: none;
    margin-bottom: 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 15px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

.secondary {
    background: #292d3a;
}

.danger {
    background: #dc3545;
}

.hidden {
    display: none !important;
}

.auth-buttons {
    display: flex;
    gap: 10px;
}

.auth-buttons button {
    flex: 1;
}

.user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.user-email {
    color: #aaa;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.upload-area {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.upload-area input[type="file"] {
    display: none;
}

.upload-label {
    display: inline-block;
    background: #5865f2;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
}

.storage {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 12px;
}

.search {
    margin-bottom: 12px;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.category {
    white-space: nowrap;
    background: #252936;
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
    color: #bbb;
}

.category.active {
    background: #5865f2;
    color: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
}

.photo {
    position: relative;
    background: #181b24;
    border-radius: 13px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
}

.star {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    font-size: 19px;
}

.delete {
    position: absolute;
    bottom: 7px;
    right: 7px;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    background: rgba(220,53,69,.9);
}

.photo-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 25px 7px 7px;
    background: linear-gradient(transparent, rgba(0,0,0,.8));
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.empty {
    text-align: center;
    color: #777;
    padding: 40px 10px;
}

#message,
#authMessage {
    margin-top: 10px;
    font-size: 14px;
    color: #9ca3af;
}

#fullscreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

#fullscreen img {
    max-width: 96%;
    max-height: 90%;
    object-fit: contain;
}

#closeFullscreen {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,.15);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    font-size: 22px;
}

.progress {
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
}

@media (max-width: 500px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    .user-bar {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<header>
    <h1>📸 My Cloud Gallery</h1>
    <div class="subtitle">
        Your personal photo & screenshot storage
    </div>
</header>

<div class="container">

    <div id="authCard" class="card">

        <h2>🔐 Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <div class="auth-buttons">

            <button id="loginBtn">
                Login
            </button>

            <button id="signupBtn" class="secondary">
                Sign Up
            </button>

        </div>

        <div id="authMessage"></div>

    </div>


    <div id="galleryApp" class="hidden">

        <div class="user-bar">

            <div
                class="user-email"
                id="userEmail">
            </div>

            <button
                id="logoutBtn"
                class="secondary">
                Logout
            </button>

        </div>


        <div class="card">

            <h3>📤 Add Photos</h3>

            <div class="upload-area">

                <label class="upload-label">

                    📸 Choose Photos

                    <input
                        type="file"
                        id="fileInput"
                        accept="image/*"
                        multiple
                    >

                </label>

            </div>

            <br>

            <select id="categorySelect">

                <option value="Other">
                    Other
                </option>

                <option value="Anime">
                    Anime
                </option>

                <option value="Gaming">
                    Gaming
                </option>

                <option value="Memes">
                    Memes
                </option>

                <option value="Personal">
                    Personal
                </option>

            </select>

            <div
                id="uploadProgress"
                class="progress">
            </div>

            <div
                class="storage"
                id="storageInfo">
                Loading storage information...
            </div>

        </div>


        <div class="card">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="🔎 Search photos..."
            >

            <div class="categories">

                <div
                    class="category active"
                    data-category="All">
                    All
                </div>

                <div
                    class="category"
                    data-category="Anime">
                    Anime
                </div>

                <div
                    class="category"
                    data-category="Gaming">
                    Gaming
                </div>

                <div
                    class="category"
                    data-category="Memes">
                    Memes
                </div>

                <div
                    class="category"
                    data-category="Personal">
                    Personal
                </div>

                <div
                    class="category"
                    data-category="Other">
                    Other
                </div>

                <div
                    class="category"
                    data-category="Favorites">
                    ⭐ Favorites
                </div>

            </div>

        </div>


        <div
            id="gallery"
            class="gallery">
        </div>

        <div
            id="empty"
            class="empty hidden">
            No photos found.
        </div>

    </div>

</div>


<div id="fullscreen">

    <button id="closeFullscreen">
        ✕
    </button>

    <img id="fullscreenImage">

</div>


<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://yknkahonccirpxwgxjxz.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HE0hav4IkkUy7sYDDaPO7A_PSqSGHSn";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const authCard =
    document.getElementById("authCard");

const galleryApp =
    document.getElementById("galleryApp");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const signupBtn =
    document.getElementById("signupBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const authMessage =
    document.getElementById("authMessage");

const userEmail =
    document.getElementById("userEmail");

const fileInput =
    document.getElementById("fileInput");

const categorySelect =
    document.getElementById("categorySelect");

const gallery =
    document.getElementById("gallery");

const empty =
    document.getElementById("empty");

const searchInput =
    document.getElementById("searchInput");

const storageInfo =
    document.getElementById("storageInfo");

const uploadProgress =
    document.getElementById("uploadProgress");

const fullscreen =
    document.getElementById("fullscreen");

const fullscreenImage =
    document.getElementById("fullscreenImage");

const closeFullscreen =
    document.getElementById("closeFullscreen");


let currentUser = null;
let photos = [];
let selectedCategory = "All";


/* =========================
   CHECK LOGIN
========================= */

async function checkUser() {

    const result =
        await supabase.auth.getUser();

    if (result.data.user) {

        currentUser =
            result.data.user;

        showGallery();

    } else {

        showLogin();

    }

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

    authCard.classList.remove(
        "hidden"
    );

    galleryApp.classList.add(
        "hidden"
    );

}


/* =========================
   SHOW GALLERY
========================= */

function showGallery() {

    authCard.classList.add(
        "hidden"
    );

    galleryApp.classList.remove(
        "hidden"
    );

    userEmail.textContent =
        currentUser.email;

    loadPhotos();

}


/* =========================
   SIGN UP
========================= */

signupBtn.addEventListener(
    "click",
    async function () {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            authMessage.textContent =
                "Enter email and password.";

            return;

        }


        if (password.length < 6) {

            authMessage.textContent =
                "Password must be at least 6 characters.";

            return;

        }


        authMessage.textContent =
            "Creating account...";


        const result =
            await supabase.auth.signUp({
                email: email,
                password: password
            });


        if (result.error) {

            authMessage.textContent =
                result.error.message;

            return;

        }


        authMessage.textContent =
            "Account created! Check your email if confirmation is required.";

    }
);


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function () {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            authMessage.textContent =
                "Enter email and password.";

            return;

        }


        authMessage.textContent =
            "Logging in...";


        const result =
            await supabase.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (result.error) {

            authMessage.textContent =
                result.error.message;

            return;

        }


        currentUser =
            result.data.user;

        showGallery();

    }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function () {

        await supabase.auth.signOut();

        currentUser = null;

        photos = [];

        gallery.innerHTML = "";

        showLogin();

    }
);


/* =========================
   AUTH STATE
========================= */

supabase.auth.onAuthStateChange(
    function (_event, session) {

        if (session && session.user) {

            currentUser =
                session.user;

            showGallery();

        } else {

            currentUser = null;

            showLogin();

        }

    }
);


/* =========================
   UPLOAD
========================= */

fileInput.addEventListener(
    "change",
    async function () {

        const files =
            Array.from(
                fileInput.files
            );


        if (!files.length) {
            return;
        }


        if (!currentUser) {

            alert(
                "Please login first."
            );

            return;

        }


        const category =
            categorySelect.value;


        let completed = 0;


        for (const file of files) {

            completed++;


            uploadProgress.textContent =
                "Uploading " +
                completed +
                "/" +
                files.length +
                ": " +
                file.name;


            try {

                await uploadPhoto(
                    file,
                    category
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Could not upload " +
                    file.name +
                    ": " +
                    error.message
                );

            }

        }


        fileInput.value = "";

        uploadProgress.textContent =
            "Upload complete.";

        await loadPhotos();

    }
);


/* =========================
   UPLOAD PHOTO
========================= */

async function uploadPhoto(
    file,
    category
) {

    if (
        file.size >
        50 * 1024 * 1024
    ) {

        throw new Error(
            "File is larger than 50 MB."
        );

    }


    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const filePath =
        currentUser.id +
        "/" +
        crypto.randomUUID() +
        "-" +
        safeName;


    const uploadResult =
        await supabase.storage
            .from("photos")
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (uploadResult.error) {

        throw uploadResult.error;

    }


    const databaseResult =
        await supabase
            .from("photos")
            .insert({

                user_id:
                    currentUser.id,

                file_path:
                    filePath,

                name:
                    file.name,

                category:
                    category,

                favorite:
                    false,

                file_size:
                    file.size

            });


    if (databaseResult.error) {

        await supabase.storage
            .from("photos")
            .remove([
                filePath
            ]);

        throw databaseResult.error;

    }

}


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos() {

    if (!currentUser) {
        return;
    }


    const result =
        await supabase
            .from("photos")
            .select("*")
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (result.error) {

        console.error(
            result.error
        );

        alert(
            "Could not load photos: " +
            result.error.message
        );

        return;

    }


    photos =
        result.data || [];


    await renderPhotos();

    updateStorageInfo();

}


/* =========================
   RENDER PHOTOS
========================= */

async function renderPhotos() {

    gallery.innerHTML = "";


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        photos.filter(
            function (photo) {

                const matchesSearch =
                    photo.name
                        .toLowerCase()
                        .includes(search);


                let matchesCategory =
                    true;


                if (
                    selectedCategory ===
                    "Favorites"
                ) {

                    matchesCategory =
                        photo.favorite === true;

                }
                else if (
                    selectedCategory !==
                    "All"
                ) {

                    matchesCategory =
                        photo.category ===
                        selectedCategory;

                }


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    if (!filtered.length) {

        empty.classList.remove(
            "hidden"
        );

        return;

    }


    empty.classList.add(
        "hidden"
    );


    for (
        const photo of filtered
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "photo";


        const img =
            document.createElement(
                "img"
            );


        const urlResult =
            await supabase.storage
                .from("photos")
                .createSignedUrl(
                    photo.file_path,
                    3600
                );


        if (urlResult.error) {

            console.error(
                urlResult.error
            );

            continue;

        }


        img.src =
            urlResult.data.signedUrl;


        img.addEventListener(
            "click",
            function () {

                fullscreenImage.src =
                    urlResult.data.signedUrl;

                fullscreen.style.display =
                    "flex";

            }
        );


        const star =
            document.createElement(
                "button"
            );

        star.className =
            "star";

        star.textContent =
            photo.favorite
                ? "★"
                : "☆";


        star.addEventListener(
            "click",
            async function (event) {

                event.stopPropagation();

                await toggleFavorite(
                    photo
                );

            }
        );


        const deleteBtn =
            document.createElement(
                "button"
            );

        deleteBtn.className =
            "delete";

        deleteBtn.textContent =
            "🗑";


        deleteBtn.addEventListener(
            "click",
            async function (event) {

                event.stopPropagation();

                await deletePhoto(
                    photo
                );

            }
        );


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "photo-name";

        name.textContent =
            photo.name;


        div.appendChild(img);

        div.appendChild(star);

        div.appendChild(deleteBtn);

        div.appendChild(name);

        gallery.appendChild(div);

    }

}


/* =========================
   FAVORITE
========================= */

async function toggleFavorite(
    photo
) {

    const result =
        await supabase
            .from("photos")
            .update({
                favorite:
                    !photo.favorite
            })
            .eq(
                "id",
                photo.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if (result.error) {

        alert(
            result.error.message
        );

        return;

    }


    photo.favorite =
        !photo.favorite;


    await renderPhotos();

}


/* =========================
   DELETE
========================= */

async function deletePhoto(
    photo
) {

    const confirmed =
        confirm(
            'Delete "' +
            photo.name +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    const storageResult =
        await supabase.storage
            .from("photos")
            .remove([
                photo.file_path
            ]);


    if (storageResult.error) {

        alert(
            "Could not delete file: " +
            storageResult.error.message
        );

        return;

    }


    const databaseResult =
        await supabase
            .from("photos")
            .delete()
            .eq(
                "id",
                photo.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if (databaseResult.error) {

        alert(
            "Could not delete database record: " +
            databaseResult.error.message
        );

        return;

    }


    photos =
        photos.filter(
            function (p) {
                return p.id !== photo.id;
            }
        );


    await renderPhotos();

    updateStorageInfo();

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    function () {

        renderPhotos();

    }
);


/* =========================
   CATEGORY FILTER
========================= */

document
    .querySelectorAll(".category")
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(
                            function (b) {

                                b.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedCategory =
                        button.dataset.category;


                    renderPhotos();

                }
            );

        }
    );


/* =========================
   STORAGE INFO
========================= */

function updateStorageInfo() {

    let total = 0;


    photos.forEach(
        function (photo) {

            total +=
                Number(
                    photo.file_size || 0
                );

        }
    );


    const mb =
        total /
        (1024 * 1024);


    storageInfo.textContent =
        mb.toFixed(2) +
        " MB used • Supabase cloud storage";

}


/* =========================
   FULLSCREEN
========================= */

closeFullscreen.addEventListener(
    "click",
    function () {

        fullscreen.style.display =
            "none";

        fullscreenImage.src = "";

    }
);


fullscreen.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            fullscreen
        ) {

            fullscreen.style.display =
                "none";

            fullscreenImage.src = "";

        }

    }
);


/* =========================
   START APP
========================= */

checkUser();

</script>

</body>
</html>
